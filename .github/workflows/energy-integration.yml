name: Run workflows

on:
  workflow_call:

jobs:
  prepare-environment:
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.set_environment.outputs.APP_VERSION }}
      ENV_SERVER: ${{ steps.pre.outputs.ENV_SERVER }}
    steps:
      - name: Prepare Version and Environment
        uses: Rakha-FR/github-action/.github/actions/prepare-version@development

  build-maven:
    container:
      image: maven:3.9.6-eclipse-temurin-17
    runs-on: ubuntu-latest
    needs: prepare-environment
    steps:
      - name: Build Maven Application
        uses: Rakha-FR/github-action/.github/actions/mvn-build@development
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
